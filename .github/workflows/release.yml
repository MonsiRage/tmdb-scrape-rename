name: Build and release exe

# Manual: Actions -> "Build and release exe" -> Run workflow (on main).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.12"
        required: true
        default: "v1.12"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Compile check
        run: python -m py_compile tmdb_format_rename.py "tmdb_刮削命名.pyw"
      - name: Build exe
        run: pyinstaller "TMDB刮削命名.spec"
      - name: Rename asset
        shell: pwsh
        run: Move-Item -Path (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName -Destination dist\TMDB-scrape-rename.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 可执行版。不需要安装 Python，也不需要旁边的 .py。

          这一版是在 v1.11 基础上的精简和小改进：

          - 去掉用处不大的选项：「命名与语言」（标题语言、文件夹格式）和「同时改名不确定的匹配」；不确定的匹配一律进「需要确认」，在那里双击选对的再跑
          - 结果标签页的表头可点击排序（自然顺序，第2季排在第10季前面），刷新或切换筛选后排序保持
          - 清理没用的代码；「改动已记录，可撤销」的提示改到运行结束时显示完整步数
          - 继承 v1.11：撤销上次改名、同名电影多版本合并和重复报告、合并季文件夹、剧集集数检查、「需要确认」标签（可按类型筛选）、导出表格
          '@
          gh release create "${{ inputs.tag }}" dist\TMDB-scrape-rename.exe --title "${{ inputs.tag }}" --notes "$notes" --target "${{ github.sha }}"
