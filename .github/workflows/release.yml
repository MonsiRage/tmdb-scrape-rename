name: Build and release exe

# Manual: Actions -> "Build and release exe" -> Run workflow (on main).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.18"
        required: true
        default: "v1.18"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Compile check
        run: python -m py_compile tmdb_format_rename.py "tmdb_刮削命名.pyw"
      - name: Build exe
        run: pyinstaller "TMDB刮削命名.spec"
      - name: Rename asset
        shell: pwsh
        run: Move-Item -Path (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName -Destination dist\TMDB-scrape-rename.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 可执行版。不需要安装 Python，也不需要旁边的 .py。

          第三轮全代码检查的修复：

          - 扫描根目录直接选成一部剧（里面是 Season 1 / Season 2）时，以前每季都被当成单独的片子、什么都没做；现在整部剧一起识别改名
          - 扫描根目录直接选成单独一季的文件夹时，以前识别不出；现在能识别
          - 根目录里电影文件和单集文件混放时，电影以前不会被收进文件夹；现在照常整理，单集文件不动
          '@
          gh release create "${{ inputs.tag }}" dist\TMDB-scrape-rename.exe --title "${{ inputs.tag }}" --notes "$notes" --target "${{ github.sha }}"
