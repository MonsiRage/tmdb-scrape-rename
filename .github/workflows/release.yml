name: Build and release exe

# Manual: Actions -> "Build and release exe" -> Run workflow (on main).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.9"
        required: true
        default: "v1.9"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Compile check
        run: python -m py_compile tmdb_format_rename.py "tmdb_刮削命名.pyw"
      - name: Build exe
        run: pyinstaller "TMDB刮削命名.spec"
      - name: Rename asset
        shell: pwsh
        run: Move-Item -Path (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName -Destination dist\TMDB-scrape-rename.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 可执行版。不需要安装 Python，也不需要旁边的 .py。

          这一版新增：电影按视频时长核对（只处理电影的 MP4 / MOV / M4V / MKV / WEBM）。

          - 视频时长和匹配到的电影在 TMDB 的片长对不上、但和另一部同名片吻合时，不自动改名，列入「未能匹配」，并写出各候选的年份和片长，可以双击选择
          - 用来发现「文件夹年份起错了一年、其实是另一部同名片」的情况
          - 窗口放得宽：不同剪辑版也算对得上（例如《末代皇帝》163 分钟院线版和约 219 分钟加长版都通过）；名字里写了 Extended / Director's Cut / 加长版 等词时更宽
          - 只是时长不同、而标题和年份都吻合的，只在日志里提示，照常改名
          - 读不出时长的文件（其它封装格式、损坏文件）直接忽略，不影响原来的识别
          - 局限：两部同名片片长接近时分不开；TMDB 没有片长记录的片无法核对
          - 上一版的同名撞车手动选择、版本词筛选、防错配、剧集支持都保留
          '@
          gh release create "${{ inputs.tag }}" dist\TMDB-scrape-rename.exe --title "${{ inputs.tag }}" --notes "$notes" --target "${{ github.sha }}"
