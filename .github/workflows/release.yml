name: Build and release exe

# Manual: Actions -> "Build and release exe" -> Run workflow (on main).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.8"
        required: true
        default: "v1.8"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Compile check
        run: python -m py_compile tmdb_format_rename.py "tmdb_刮削命名.pyw"
      - name: Build exe
        run: pyinstaller "TMDB刮削命名.spec"
      - name: Rename asset
        shell: pwsh
        run: Move-Item -Path (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName -Destination dist\TMDB-scrape-rename.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 可执行版。不需要安装 Python，也不需要旁边的 .py。

          这一版处理同名撞车，并补上一批识别问题：

          - 「未能匹配」里双击一行，可以从候选里选一个（或直接填 TMDB 编号）；选完再点「仅预览」/「确认刮削」就按你的选择处理。候选写明了年份、国家、编号
          - 文件夹名里的版本词会用来筛同名候选：美版、英版、日版、韩版、瑞典版……，以及 (US) / (UK)、Shameless.US.S01E01 这类写法
          - 文件夹没写年份时，用里面视频文件名一致的年份
          - 没写年份的 `WALL-E`、`Wall E` 现在也能找到 `WALL·E`；标题里的空格、连字符、间隔号不再影响比对
          - 带有「不确定」「候选」说明的条目不会被自动改名，除非勾选「同时改名不确定的」
          - 上一版的防错配、剧集（Season 子文件夹、tvshow.nfo）、电影/剧集同编号处理都保留
          '@
          gh release create "${{ inputs.tag }}" dist\TMDB-scrape-rename.exe --title "${{ inputs.tag }}" --notes "$notes" --target "${{ github.sha }}"
