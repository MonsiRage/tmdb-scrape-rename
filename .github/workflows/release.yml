name: Build and release exe

# Manual: Actions -> "Build and release exe" -> Run workflow (on main).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.11"
        required: true
        default: "v1.11"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Compile check
        run: python -m py_compile tmdb_format_rename.py "tmdb_刮削命名.pyw"
      - name: Build exe
        run: pyinstaller "TMDB刮削命名.spec"
      - name: Rename asset
        shell: pwsh
        run: Move-Item -Path (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName -Destination dist\TMDB-scrape-rename.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 可执行版。不需要安装 Python，也不需要旁边的 .py。

          这一版新增：

          - 撤销上次改名：每次正式更改都有记录，首页和结果页的「撤销上次改名」可以还原（包括合并的版本/季）
          - 同一部电影有多个文件夹：不同版本（Extended、4K、Remux 等）合并成一个文件夹并给视频加版本标记；完全一样的列为「重复影片」，写明分辨率、片长、大小，由你决定
          - 合并季文件夹（默认开启）：同一部剧各季的独立文件夹并入「剧名/Season NN」，预览逐条列出
          - 剧集季数/集数检查：本地季数超出所选剧集、而同名剧集吻合时，列进「需要确认」
          - 首页新增「命名与语言」：标题语言（自动/繁体/英文）；文件夹格式二选一（标题 或 原名）
          - 「未能匹配」改名「需要确认」，可按电影/剧集筛选；新增「导出表格」（CSV）
          - 修复：名字里的 [tmdbid=1948] 被当成年份而误报「电影和剧集都匹配到了」；带括号年份的标题可重试
          '@
          gh release create "${{ inputs.tag }}" dist\TMDB-scrape-rename.exe --title "${{ inputs.tag }}" --notes "$notes" --target "${{ github.sha }}"
