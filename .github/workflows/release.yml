name: Build and release exe

# Manual: Actions -> "Build and release exe" -> Run workflow (on main).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.17"
        required: true
        default: "v1.17"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Compile check
        run: python -m py_compile tmdb_format_rename.py "tmdb_刮削命名.pyw"
      - name: Build exe
        run: pyinstaller "TMDB刮削命名.spec"
      - name: Rename asset
        shell: pwsh
        run: Move-Item -Path (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName -Destination dist\TMDB-scrape-rename.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 可执行版。不需要安装 Python，也不需要旁边的 .py。

          第二轮全代码检查的修复：

          - 修复：分碟文件夹（CD1/CD2）放在「电影」这类分类文件夹里时，分类文件夹可能被整个改名成那部片；现在只合并分碟，分类文件夹不动
          - 修复：CD2 / D2 / Disc2 的碟号被当成续集编号，第二碟搜不到
          - 修复：名字里已有 [tmdbid=N] 的文件夹，在 N 同时是电影和剧集时可能被换成别的编号；现在只判断是电影还是剧集
          - 修复：网盘兜底改名时，名字带 & 的文件夹会出错
          - 每次运行都用新的 TMDB 数据（exe 里连续运行不再越用越占内存）；撤销记录只保留最近 30 次
          '@
          gh release create "${{ inputs.tag }}" dist\TMDB-scrape-rename.exe --title "${{ inputs.tag }}" --notes "$notes" --target "${{ github.sha }}"
