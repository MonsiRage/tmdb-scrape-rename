name: Build and release exe

# Manual: Actions -> "Build and release exe" -> Run workflow (on main).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.6"
        required: true
        default: "v1.6"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Compile check
        run: python -m py_compile tmdb_format_rename.py "tmdb_刮削命名.pyw"
      - name: Build exe
        run: pyinstaller "TMDB刮削命名.spec"
      - name: Rename asset
        shell: pwsh
        run: Move-Item -Path (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName -Destination dist\TMDB-scrape-rename.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Windows 可执行版。不需要安装 Python，也不需要旁边的 .py。

          - 不再内置 API Key：没填或填错会直接提示，不会悄悄用共用 key
          - 网络 / API 出错时显示「搜索失败」，不再误报「搜索无结果」
          - 库根目录名（如 lib、Movies2）不再被当作片名或续集标记，避免整库匹配失败
          - 电影和剧集编号相同时，按匹配到的类型取片名
          - 片名本身带数字（2046、1917、Blade Runner 2049）也能搜到
          - 图片下载失败会重试，并计入失败；缺海报的文件夹在「只刮削新添加的」模式下会再检查
          - 删除了不完整的 .bat 启动脚本
          "@
          gh release create "${{ inputs.tag }}" dist\TMDB-scrape-rename.exe --title "${{ inputs.tag }}" --notes "$notes" --target "${{ github.sha }}"
