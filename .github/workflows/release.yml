name: Build and release exe

# Manual: Actions -> "Build and release exe" -> Run workflow (on main).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.10"
        required: true
        default: "v1.10"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Compile check
        run: python -m py_compile tmdb_format_rename.py "tmdb_刮削命名.pyw"
      - name: Build exe
        run: pyinstaller "TMDB刮削命名.spec"
      - name: Rename asset
        shell: pwsh
        run: Move-Item -Path (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName -Destination dist\TMDB-scrape-rename.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 可执行版。不需要安装 Python，也不需要旁边的 .py。

          这一版主要是提速和几处边角问题：

          - 扫描明显更快：请求复用连接，CPU 占用大幅下降；带「剧集/电影」提示的文件夹少发一半搜索；速率上限提到 40 次/秒
          - 已改名的库重新扫描更快：编号是电影还是剧集的判断结果会保存下来
          - 网络出错不再被当成「这个编号不存在」，避免把剧集当成电影
          - 散落视频被收进新文件夹时，同名的字幕、nfo、海报图跟着一起移动
          - 扫描根目录自己的名字不再被当成片名去搜索
          - 缓存文件先写临时文件再替换，不会因为中途退出而损坏；读取目录改用更省调用的方式（对网络共享盘更明显）
          - 上一版的时长核对、同名撞车手动选择、版本词筛选、防错配、剧集支持都保留
          '@
          gh release create "${{ inputs.tag }}" dist\TMDB-scrape-rename.exe --title "${{ inputs.tag }}" --notes "$notes" --target "${{ github.sha }}"
