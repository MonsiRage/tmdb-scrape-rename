name: Build and release exe

# Manual: Actions -> "Build and release exe" -> Run workflow (on main).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.7"
        required: true
        default: "v1.7"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Compile check
        run: python -m py_compile tmdb_format_rename.py "tmdb_刮削命名.pyw"
      - name: Build exe
        run: pyinstaller "TMDB刮削命名.spec"
      - name: Rename asset
        shell: pwsh
        run: Move-Item -Path (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName -Destination dist\TMDB-scrape-rename.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 可执行版。不需要安装 Python，也不需要旁边的 .py。

          这一版主要是防错配和剧集支持：

          - 搜到的标题和文件夹名对不上（只有年份或个别词对上）时，不再直接改名，列入「未能匹配」并写明原因和候选；勾选「同时改名不确定的」才会改
          - 文件夹名里的完整标题必须和 TMDB 标题一致（It.Boy 不会再被配成 Boy），中文版本标签（如「（瑞典版）」）会一起搜索
          - 剧集：`Season 01`、`S02`、`第一季` 子文件夹的剧，按剧文件夹识别；分集文件不再被当成散落电影；只写一个 `tvshow.nfo`
          - 电影和剧集共用同一个编号时（如 40360），各自取各自的资料，不再互相串
          - 带 `[tmdbid=]` 的文件夹也会判断是电影还是剧集
          - 去掉中文发布站标签（【高清电影】、[国英双语]）、Extended.Cut、发布组后缀；`2046`、`1917` 这类数字片名能搜到
          - 近似年份容差收紧为 ±1 年
          - 图片下载失败会重试 4 次并计入失败
          '@
          gh release create "${{ inputs.tag }}" dist\TMDB-scrape-rename.exe --title "${{ inputs.tag }}" --notes "$notes" --target "${{ github.sha }}"
