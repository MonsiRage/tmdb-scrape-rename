name: Build and release exe

# Manual: Actions -> "Build and release exe" -> Run workflow (on main).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.15"
        required: true
        default: "v1.15"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Compile check
        run: python -m py_compile tmdb_format_rename.py "tmdb_刮削命名.pyw"
      - name: Build exe
        run: pyinstaller "TMDB刮削命名.spec"
      - name: Rename asset
        shell: pwsh
        run: Move-Item -Path (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName -Destination dist\TMDB-scrape-rename.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 可执行版。不需要安装 Python，也不需要旁边的 .py。

          这一版修合并季在网络盘 / 网盘上失败的问题：

          - 修复：合并季失败后重试时误把季文件夹改名成已存在的剧目录，报 WinError 183 并盖住了真正的错误。现在重试会重做同一个合并，并显示第一次的真实错误
          - 合并一季时整个季文件夹只移动一次（变成 剧名\Season NN），操作少一半多，网络盘上更稳；遇到短暂的「找不到路径 / 文件被占用」会稍等重试；系统改名不支持时改用 Windows 的 move 再试
          - 移动失败时不会留下空的剧目录，季文件夹原样不动
          - Specials / 特别篇 / 特典 / 番外 文件夹对应 TMDB 第 0 季，放进剧目录下的 Specials，不再让整部剧卡在「看不出是第几季」
          - 继承 v1.14：分季文件夹合并到 Season NN、新加的一季并进已有剧目录、只保留自动模式
          '@
          gh release create "${{ inputs.tag }}" dist\TMDB-scrape-rename.exe --title "${{ inputs.tag }}" --notes "$notes" --target "${{ github.sha }}"
