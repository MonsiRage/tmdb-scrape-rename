name: Build and release exe

# Manual: Actions -> "Build and release exe" -> Run workflow (on main).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.13"
        required: true
        default: "v1.13"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Compile check
        run: python -m py_compile tmdb_format_rename.py "tmdb_刮削命名.pyw"
      - name: Build exe
        run: pyinstaller "TMDB刮削命名.spec"
      - name: Rename asset
        shell: pwsh
        run: Move-Item -Path (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName -Destination dist\TMDB-scrape-rename.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 可执行版。不需要安装 Python，也不需要旁边的 .py。

          修复：exe 放在网络盘 / NAS（例如 Z:\\）上时，启动报 WinError 1005（The volume does not contain a recognized file system）直接崩溃。现在查不到真实路径时按原路径继续启动。

          功能与 v1.12 相同：撤销上次改名、同名电影多版本合并和重复报告、合并季文件夹、剧集集数检查、「需要确认」标签（可按类型筛选、表头可排序）、导出表格。
          '@
          gh release create "${{ inputs.tag }}" dist\TMDB-scrape-rename.exe --title "${{ inputs.tag }}" --notes "$notes" --target "${{ github.sha }}"
