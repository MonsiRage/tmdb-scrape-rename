name: Build and release exe

# Manual: Actions -> "Build and release exe" -> Run workflow (on main).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.16"
        required: true
        default: "v1.16"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Compile check
        run: python -m py_compile tmdb_format_rename.py "tmdb_刮削命名.pyw"
      - name: Build exe
        run: pyinstaller "TMDB刮削命名.spec"
      - name: Rename asset
        shell: pwsh
        run: Move-Item -Path (Get-ChildItem dist\*.exe | Select-Object -First 1).FullName -Destination dist\TMDB-scrape-rename.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          Windows 可执行版。不需要安装 Python，也不需要旁边的 .py。

          这一版是全代码检查后的修复：

          - 「停止」在 exe 里终于有用了：做完手上这一步就停，已做的改动可以撤销；运行中不能再误点撤销 / 关窗口会先停止
          - 英文片名里的 Show / Movie / Series / Film / Cinema 不再被当成类型词删掉（楚门的世界、惊声尖笑、天堂电影院、乐高大电影等以前搜不到）
          - Specials / 特别篇 不再算进片名（假面骑士空我这类会合并成 Season 01 + Specials）
          - 修复：连续撤销时确认框显示的和实际撤销的不是同一次
          - 修复：整理多碟文件夹时会删掉没移出来的小文件；现在程序不删除任何文件
          - 改名失败的重试和第一次走同一套逻辑；撤销也支持网盘
          - 全都搜不到时，再用片名的前半段搜（如 Series.7.The.Contenders → Series 7），搜到的只作为候选列进「需要确认」，不会自动改名
          - 旧规则留下的搜索缓存自动清掉；没有海报的影片不再每次重新下载资料
          '@
          gh release create "${{ inputs.tag }}" dist\TMDB-scrape-rename.exe --title "${{ inputs.tag }}" --notes "$notes" --target "${{ github.sha }}"
